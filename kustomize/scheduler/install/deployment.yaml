apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler

  annotations:
    keel.sh/policy: force
    keel.sh/trigger: poll
    keel.sh/match-tag: true

spec:
  replicas: 1
  selector:
    matchLabels:
      resultes.net/component: scheduler
  template:
    metadata:
      labels:
        resultes.net/component: scheduler
    spec:
      containers:
        - image: ghcr.io/resultes-net/scheduler:latest
          name: scheduler
          ports:
            - containerPort: 5678
          env:
            - name: MY_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: SERVER_HOST
              value: internal-server.server.svc.cluster.local
            - name: SERVER_PORT
              value: "8000"
            - name: RUNNER_HOST
              value: 172.21.0.115
            - name: RUNNER_PORT
              value: "3000"
            - name: POLLING_PERIOD_SECONDS
              value: "30"
            - name: USE_OPENSTACK
              value: "1"
            - name: OS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: os-password-secret
                  key: os-password
          volumeMounts:
            - name: config-volume
              mountPath: /app/config-cm
      volumes:
        - name: config-volume
          configMap:
            name: config-cm

                            
      imagePullSecrets:
        - name: read-ghcr-io-auth-secret
      restartPolicy: Always
