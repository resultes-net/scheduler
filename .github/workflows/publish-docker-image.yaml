name: Create and publish Docker image

on:
  push:
    branches:
      - '*'

jobs:
  build-and-push-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ vars.READ_RESULTES_REPOS_APP_ID }}
          private-key: ${{ secrets.READ_RESULTES_REPOS_APP_KEY }}
          repositories: |
            scheduler
            dev-utils
            docker-utils
            pydantic-models
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
          submodules: 'true'
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -f docker/Dockerfile -t ghcr.io/resultes-net/scheduler:latest .

      - name: Push Docker image
        id: push
        run: |
          docker push ghcr.io/resultes-net/scheduler:latest
